name: Sync and Dump

on:
  workflow_dispatch:
  schedule:
    - cron: '42 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Always pull the latest xi-events HEAD even if pip has a cached wheel for the URL
      - run: pip install --no-cache-dir --upgrade --force-reinstall --no-deps git+https://github.com/sruon/xi-events-py.git
      - run: pip install -e .

      - name: Build DAT file list
        run: |
          for script in scripts/*/dump.py; do
            python3 "$script" list-files
          done | sort -u > all-dats.txt
          echo "$(wc -l < all-dats.txt) files to fetch"

      - uses: sruon/ffxi-fetch-action@v1
        id: ffxi
        with:
          files-from: all-dats.txt
          output-dir: dat
        env:
          BUCKET_KEY_ID: ${{ secrets.BUCKET_KEY_ID }}
          BUCKET_APP_KEY: ${{ secrets.BUCKET_APP_KEY }}

      - name: Run all dump scripts
        run: python3 scripts/run_all.py dump --version "${{ steps.ffxi.outputs.version }}" --base-path dat --output-dir dist

      - name: Check for existing release
        id: check
        run: |
          VERSION="${{ steps.ffxi.outputs.version }}"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app token
        if: steps.check.outputs.exists == 'false'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOTIFIER_APP_ID }}
          private-key: ${{ secrets.NOTIFIER_APP_PRIVATE_KEY }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.ffxi.outputs.version }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Automated dump for FFXI version $VERSION" \
            dist/*
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
